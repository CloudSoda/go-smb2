on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test_linux:
    strategy:
      fail-fast: false
      matrix:
        go: [1.26.1]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
        restore-keys: ${{ runner.os }}-go-${{ matrix.go }}-
    - name: Start Samba
      run: |
        docker build -t go-smb2-samba:test .github/docker
        docker run -d --name go-smb2-samba -p 445:445 go-smb2-samba:test
        cp ./.github/client_conf.json ./
        for i in $(seq 1 30); do
          if nc -z 127.0.0.1 445; then exit 0; fi
          sleep 1
        done
        echo "samba did not come up"
        docker logs go-smb2-samba
        exit 1
    - name: Test
      run: go test -v -race ./...
    - name: Samba logs on failure
      if: failure()
      run: docker logs go-smb2-samba
    - name: staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  coverage:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.1
    - name: Start Samba
      run: |
        docker build -t go-smb2-samba:test .github/docker
        docker run -d --name go-smb2-samba -p 445:445 go-smb2-samba:test
        cp ./.github/client_conf.json ./
        for i in $(seq 1 30); do
          if nc -z 127.0.0.1 445; then exit 0; fi
          sleep 1
        done
        echo "samba did not come up"
        docker logs go-smb2-samba
        exit 1
    - name: Coverage
      run: |
        go test -count=1 -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
        go tool cover -func=coverage.out | tail -1
    - name: Enforce minimum
      run: make cover-check
    - uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        go: [1.26.1]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\go-build
          ~\go\pkg\mod
        key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
        restore-keys: ${{ runner.os }}-go-${{ matrix.go }}-
    - name: Create shares
      shell: cmd
      run: |
        mkdir C:\tmp
        net user smbuser Smbpasswd12345 /add
        net share tmp="C:\tmp" /GRANT:smbuser,full
        net share tmp2="C:\tmp" /GRANT:smbuser,read
    - name: Test
      run: |
        cp ./.github/client_conf.json ./
        go test -v -race ./...
